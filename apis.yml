name: Clementine
description: 'Clementine (Clementine Labs) was a New York based enterprise communication
  startup founded in 2013 and publicly launched in September 2014, offering workplace
  messaging, chat, and conference calling that let colleagues reach each other without
  exchanging personal mobile phone numbers. It appears on the Andreessen Horowitz
  investment list and was acquired by Dropbox in April 2016, after which the Clementine
  service was shut down and the team folded into Dropbox collaboration efforts. The
  company operates no public API, developer portal, documentation, or SDKs today: its
  primary domain, clementine.io, now issues an HTTP 301 redirect to dropbox.com. This
  profile is retained as a historical, non-operational record in the API Evangelist
  network.'
